appId: com.murphyereader.app
productName: MurphyEReader
# Reuse the Electron distribution installed by npm. Without this,
# electron-builder re-downloads the same zip from GitHub on every package,
# which fails on networks that cannot reach the release host.
electronDist: node_modules/electron/dist
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: MurphyEReader-${version}-setup.${ext}
npmRebuild: true
